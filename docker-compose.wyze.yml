## Wyze Bridge — exposes Wyze cameras via REST API + RTSP
##
## Usage:
##   docker-compose -f docker-compose.wyze.yml up -d
##   OR:  python main.py wyze-bridge start
##
## Before first run:
##   1. Set a Wyze password: go to wyze.com → "Forgot Password" using your Google email
##   2. Create an API key at https://developer-api-console.wyze.com/
##
## Ports:
##   5151  — REST API (PTZ control, snapshots) — avoids macOS AirPlay on 5000
##   8554  — RTSP streams (rtsp://localhost:8554/{camera-name})
##   8888  — HLS streams (http://localhost:8888/{camera-name})
##   8889  — WebRTC streams

services:
  wyze-bridge:
    image: mrlt8/wyze-bridge:latest
    container_name: wyze-bridge
    restart: unless-stopped
    ports:
      - "5151:5000"   # REST API (host:container)
      - "8554:8554"   # RTSP
      - "8888:8888"   # HLS
      - "8889:8889"   # WebRTC
      - "1935:1935"   # RTMP
    environment:
      - WYZE_EMAIL=${WYZE_EMAIL}
      - WYZE_PASSWORD=${WYZE_PASSWORD}
      - API_ID=${WYZE_KEY_ID:-}
      - API_KEY=${WYZE_API_KEY:-}
      # API and auth
      - WB_API=true
      - WB_AUTH=false
      # TUTK P2P: use ANY mode (cloud relay) since Docker can't reach LAN directly
      - NET_MODE=ANY
      - ENABLE_AUDIO=true
      # On-demand streaming: only connect when someone requests
      - ON_DEMAND=true
      # Timeout: give cameras more time to connect
      - CONNECT_TIMEOUT=60
    volumes:
      - wyze-tokens:/tokens

volumes:
  wyze-tokens:
